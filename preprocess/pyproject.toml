[project]
name = "preprocess"
version = "0.1.0"
description = "Preprocess Waymo"
readme = "README.md"
requires-python = ">=3.10,<3.11"

dependencies = [
  "torch==2.5.0",
  "waymo-open-dataset-tf-2-12-0",
]

[tool.uv.sources]
torch = [{ index = "torch-cu124" }]

[[tool.uv.index]]
name = "torch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
